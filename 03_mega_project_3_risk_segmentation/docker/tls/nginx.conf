# Real TLS-termination reverse-proxy config for MP3 -- Risk Segmentation --
# ready to bind-mount into the `nginx` service in docker-compose.tls.yml
# (see that file's own header comment for usage). One `server` block per
# service in this Mega Project; each listens on its own real TLS port and
# reverse-proxies to that service's own container over the internal Docker
# network (service name = hostname -- not 127.0.0.1, since nginx runs in
# its own container here).
#
# Cert/key paths are fixed (/etc/nginx/tls/cert.pem, .../key.pem) because
# docker-compose.tls.yml bind-mounts real files to those exact paths --
# generate them first with scripts/generate_local_tls_cert.sh, or supply a
# real CA-issued cert/key at the same two paths for a real deployment.
#
# TLS port convention (uniform across all 5 Mega Projects, see TLS.md):
# TLS port = 9000 + the service's own plain-HTTP port's last 3 digits.
worker_processes 1;
error_log /dev/stderr;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    server {
        listen 9007 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://risk-tier-assignment:8007;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
    server {
        listen 9008 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://bureau-segment-assignment:8008;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
    server {
        listen 9009 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://repayment-segment-assignment:8009;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
    server {
        listen 9010 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://utilization-segment-assignment:8010;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
