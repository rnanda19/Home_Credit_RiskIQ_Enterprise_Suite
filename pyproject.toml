[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-credit-riskiq"
version = "1.0.0"
description = "Home Credit Default Risk — real, end-to-end credit-risk enterprise suite (shared feature/reporting/serving library + Mega Project notebooks)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nandagopal R" }]
dependencies = [
    "polars>=1.20",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "psutil>=5.9",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
serving = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
explainability = ["shap>=0.51", "lime>=0.2"]
dev = ["pytest>=8.0", "httpx>=0.27", "pyflakes>=3.2", "black>=24.0", "bandit>=1.7", "nbformat>=5.9"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 110
