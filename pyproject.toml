[build-system]
requires = ["setuptools>=83"]  # 2026-10-14: setuptools<83 carries PYSEC-2026-3447
build-backend = "setuptools.build_meta"

[project]
name = "home-credit-riskiq"
version = "1.0.0"
description = "Home Credit Default Risk — real, end-to-end credit-risk enterprise suite (shared feature/reporting/serving library + Mega Project notebooks)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All-Rights-Reserved" }
authors = [{ name = "Nandagopal R" }]
dependencies = [
    "polars>=1.20",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "psutil>=5.9",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
serving = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyjwt>=2.15.1",  # 2026-10-14: real OAuth2/JWT (see src/serving/auth_common.py); replaces python-jose (CVE-2026-85394)
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
]
explainability = ["shap>=0.51", "lime>=0.2"]
dev = ["pytest>=8.0", "httpx>=0.27", "pyflakes>=3.2", "black>=24.0", "bandit>=1.7", "nbformat>=5.9"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 110
