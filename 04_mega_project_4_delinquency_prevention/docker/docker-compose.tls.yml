# MP4 -- Delinquency Prevention -- REAL TLS-terminated deployment.
# Opt-in alternative to docker-compose.yml (that file is untouched and
# still works exactly as before for plain-HTTP local dev). This file
# terminates TLS in front of every service in this Mega Project with a
# real nginx reverse proxy and does NOT publish any backend's plain-HTTP
# port externally -- only reachable from nginx over the internal Docker
# network (see TLS.md's disclosed "bind backend to internal network only"
# recommendation, now closed here).
#
# Usage (from the suite root):
#   1. scripts/generate_local_tls_cert.sh 04_mega_project_4_delinquency_prevention/docker/tls
#      (or supply a real CA-issued cert.pem/key.pem at that same path for
#      a real deployment behind an actual domain)
#   2. docker compose -f 04_mega_project_4_delinquency_prevention/docker/docker-compose.tls.yml up --build
#   curl -k https://localhost:9011/health   (early-delinquency-scoring)
#   curl -k https://localhost:9012/health   (payment-pattern-assignment)
#   curl -k https://localhost:9013/health   (revolving-distress-scoring)
#   curl -k https://localhost:9014/health   (pos-cash-trajectory-scoring)
#
# API_KEY is still REQUIRED (see docker/.env.example) -- TLS termination
# protects the transport layer, it does not replace authentication.
services:
  early-delinquency-scoring:
    build:
      context: ../../
      dockerfile: 04_mega_project_4_delinquency_prevention/docker/Dockerfile
    command: ["uvicorn", "early_delinquency_scoring_service:app", "--host", "0.0.0.0", "--port", "8011"]
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see docker/.env.example}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}  # optional -- OAuth2/JWT path (2026-09-08 hardening)
      - HEALTHCHECK_PORT=8011
    expose:
      - "8011"
    # no `ports:` here on purpose -- only nginx (below) is reachable from
    # outside this compose network. Use the nginx TLS port to reach this
    # service, not this container's own plain-HTTP port.

  payment-pattern-assignment:
    build:
      context: ../../
      dockerfile: 04_mega_project_4_delinquency_prevention/docker/Dockerfile
    command: ["uvicorn", "payment_pattern_assignment_service:app", "--host", "0.0.0.0", "--port", "8012"]
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see docker/.env.example}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}  # optional -- OAuth2/JWT path (2026-09-08 hardening)
      - HEALTHCHECK_PORT=8012
    expose:
      - "8012"
    # no `ports:` here on purpose -- only nginx (below) is reachable from
    # outside this compose network. Use the nginx TLS port to reach this
    # service, not this container's own plain-HTTP port.

  revolving-distress-scoring:
    build:
      context: ../../
      dockerfile: 04_mega_project_4_delinquency_prevention/docker/Dockerfile
    command: ["uvicorn", "revolving_distress_scoring_service:app", "--host", "0.0.0.0", "--port", "8013"]
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see docker/.env.example}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}  # optional -- OAuth2/JWT path (2026-09-08 hardening)
      - HEALTHCHECK_PORT=8013
    expose:
      - "8013"
    # no `ports:` here on purpose -- only nginx (below) is reachable from
    # outside this compose network. Use the nginx TLS port to reach this
    # service, not this container's own plain-HTTP port.

  pos-cash-trajectory-scoring:
    build:
      context: ../../
      dockerfile: 04_mega_project_4_delinquency_prevention/docker/Dockerfile
    command: ["uvicorn", "pos_cash_trajectory_scoring_service:app", "--host", "0.0.0.0", "--port", "8014"]
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see docker/.env.example}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}  # optional -- OAuth2/JWT path (2026-09-08 hardening)
      - HEALTHCHECK_PORT=8014
    expose:
      - "8014"
    # no `ports:` here on purpose -- only nginx (below) is reachable from
    # outside this compose network. Use the nginx TLS port to reach this
    # service, not this container's own plain-HTTP port.

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - early-delinquency-scoring
      - payment-pattern-assignment
      - revolving-distress-scoring
      - pos-cash-trajectory-scoring
    volumes:
      - ./tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls/cert.pem:/etc/nginx/tls/cert.pem:ro
      - ./tls/key.pem:/etc/nginx/tls/key.pem:ro
    ports:
      - "9011:9011"
      - "9012:9012"
      - "9013:9013"
      - "9014:9014"

