# MP1 -- Underwriting & Approval Intelligence -- REAL TLS-terminated deployment.
# Opt-in alternative to docker-compose.yml (that file is untouched and
# still works exactly as before for plain-HTTP local dev). This file
# terminates TLS in front of every service in this Mega Project with a
# real nginx reverse proxy and does NOT publish any backend's plain-HTTP
# port externally -- only reachable from nginx over the internal Docker
# network (see TLS.md's disclosed "bind backend to internal network only"
# recommendation, now closed here).
#
# Usage (from the suite root):
#   1. scripts/generate_local_tls_cert.sh 01_mega_project_1_underwriting_approval/docker/tls
#      (or supply a real CA-issued cert.pem/key.pem at that same path for
#      a real deployment behind an actual domain)
#   2. docker compose -f 01_mega_project_1_underwriting_approval/docker/docker-compose.tls.yml up --build
#   curl -k https://localhost:9001/health   (credit-default-prediction)
#   curl -k https://localhost:9002/health   (loan-application-approval)
#   curl -k https://localhost:9003/health   (credit-score-estimation)
#   curl -k https://localhost:9004/health   (repayment-capacity-analysis)
#
# API_KEY is still REQUIRED (see docker/.env.example) -- TLS termination
# protects the transport layer, it does not replace authentication.
services:
  credit-default-prediction:
    build:
      context: ../../
      dockerfile: 01_mega_project_1_underwriting_approval/docker/Dockerfile
    command: ["uvicorn", "credit_default_scoring_service:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see docker/.env.example}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}  # optional -- OAuth2/JWT path (2026-09-08 hardening)
      - HEALTHCHECK_PORT=8001
    expose:
      - "8001"
    # no `ports:` here on purpose -- only nginx (below) is reachable from
    # outside this compose network. Use the nginx TLS port to reach this
    # service, not this container's own plain-HTTP port.

  loan-application-approval:
    build:
      context: ../../
      dockerfile: 01_mega_project_1_underwriting_approval/docker/Dockerfile
    command: ["uvicorn", "loan_approval_scoring_service:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see docker/.env.example}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}  # optional -- OAuth2/JWT path (2026-09-08 hardening)
      - HEALTHCHECK_PORT=8002
    expose:
      - "8002"
    # no `ports:` here on purpose -- only nginx (below) is reachable from
    # outside this compose network. Use the nginx TLS port to reach this
    # service, not this container's own plain-HTTP port.

  credit-score-estimation:
    build:
      context: ../../
      dockerfile: 01_mega_project_1_underwriting_approval/docker/Dockerfile
    command: ["uvicorn", "credit_score_service:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see docker/.env.example}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}  # optional -- OAuth2/JWT path (2026-09-08 hardening)
      - HEALTHCHECK_PORT=8003
    expose:
      - "8003"
    # no `ports:` here on purpose -- only nginx (below) is reachable from
    # outside this compose network. Use the nginx TLS port to reach this
    # service, not this container's own plain-HTTP port.

  repayment-capacity-analysis:
    build:
      context: ../../
      dockerfile: 01_mega_project_1_underwriting_approval/docker/Dockerfile
    command: ["uvicorn", "repayment_capacity_service:app", "--host", "0.0.0.0", "--port", "8004"]
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see docker/.env.example}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}  # optional -- OAuth2/JWT path (2026-09-08 hardening)
      - HEALTHCHECK_PORT=8004
    expose:
      - "8004"
    # no `ports:` here on purpose -- only nginx (below) is reachable from
    # outside this compose network. Use the nginx TLS port to reach this
    # service, not this container's own plain-HTTP port.

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - credit-default-prediction
      - loan-application-approval
      - credit-score-estimation
      - repayment-capacity-analysis
    volumes:
      - ./tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls/cert.pem:/etc/nginx/tls/cert.pem:ro
      - ./tls/key.pem:/etc/nginx/tls/key.pem:ro
    ports:
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
      - "9004:9004"

