name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  notebook-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install nbformat
        run: pip install nbformat
      - name: Validate every notebook is well-formed (nbformat schema)
        run: |
          python - <<'EOF'
          import glob, sys
          import nbformat
          failed = []
          for path in glob.glob("**/*.ipynb", recursive=True):
              try:
                  nb = nbformat.read(path, as_version=4)
                  nbformat.validate(nb)
                  print(f"OK   {path}")
              except Exception as e:
                  failed.append((path, e))
                  print(f"FAIL {path}: {e}")
          if failed:
              sys.exit(1)
          EOF

  shared-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared serving dependencies
        # 2026-09-02 fix: this job was failing CI -- test_serving_common.py
        # builds real fitted scikit-learn bundles in-fixture (joblib, numpy,
        # scikit-learn) and scoring_service_common.py's /score handler does
        # a lazy `import pandas` to build the prediction row -- none of
        # which were declared here, so a fresh CI runner ModuleNotFoundError'd
        # in ~11s. Verified fixed in a clean venv with exactly this install
        # list: 18/18 tests pass. (It passed locally before this fix only
        # because the sandbox's ambient Python already had these installed
        # -- an undeclared-dependency gap, not a code or test bug.)
        run: pip install fastapi "uvicorn[standard]" pydantic pytest httpx joblib numpy scikit-learn pandas
      - name: Run src/tests/ (HYPER shared-component tests -- auth_common.py,
          explainability_common.py; no business data, no notebook artifacts needed)
        run: python -m pytest src/tests/ -v

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - 01_mega_project_1_underwriting_approval
          - 02_mega_project_2_regulatory_capital
          - 03_mega_project_3_risk_segmentation
          - 04_mega_project_4_delinquency_prevention
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install serving + test dependencies
        run: |
          if [ -f "${{ matrix.project }}/services/requirements-services.txt" ]; then
            pip install -r ${{ matrix.project }}/services/requirements-services.txt
          fi
          pip install pytest httpx
        if: hashFiles(format('{0}/tests/**', matrix.project)) != ''
      - name: Run scoring-service tests
        run: |
          cd ${{ matrix.project }}
          pytest tests/ -v
        if: hashFiles(format('{0}/tests/**', matrix.project)) != ''
        # Tests that need a real trained model bundle or fitted segment
        # model (each project's own .joblib bundles -- gitignored, produced
        # only by running those notebooks on real data) are marked
        # skip-if-missing rather than failing CI on a fresh clone with no
        # bundle present yet -- see each project's tests/test_scoring_services.py.
        # Every /schema and /score call in these tests now sends a real
        # X-API-Key header matching a monkeypatched API_KEY env var
        # (2026-09-02 hardening -- see src/serving/auth_common.py); /health
        # stays unauthenticated on every service. The matrix includes Mega
        # Project 4 with a hashFiles guard so this job does not fail before
        # MP4's own tests/ directory exists yet.
