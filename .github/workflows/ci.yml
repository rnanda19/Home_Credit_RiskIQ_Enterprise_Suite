name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  notebook-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install nbformat
        run: pip install nbformat
      - name: Validate every notebook is well-formed (nbformat schema)
        run: |
          python - <<'EOF'
          import glob, sys
          import nbformat
          failed = []
          for path in glob.glob("**/*.ipynb", recursive=True):
              try:
                  nb = nbformat.read(path, as_version=4)
                  nbformat.validate(nb)
                  print(f"OK   {path}")
              except Exception as e:
                  failed.append((path, e))
                  print(f"FAIL {path}: {e}")
          if failed:
              sys.exit(1)
          EOF

  shared-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install shared serving dependencies
        # 2026-09-02 fix: this job was failing CI -- test_serving_common.py
        # builds real fitted scikit-learn bundles in-fixture (joblib, numpy,
        # scikit-learn) and scoring_service_common.py's /score handler does
        # a lazy `import pandas` to build the prediction row -- none of
        # which were declared here, so a fresh CI runner ModuleNotFoundError'd
        # in ~11s. Verified fixed in a clean venv with exactly this install
        # list: 18/18 tests pass. (It passed locally before this fix only
        # because the sandbox's ambient Python already had these installed
        # -- an undeclared-dependency gap, not a code or test bug.)
        # 2026-09-02 second fix: same class of gap -- src/tests/test_liquidity_
        # cashflow_features.py (added with Mega Project 5's HYPER shared feature
        # module) does `import polars as pl` at module level, which was not
        # declared here either, so a fresh CI runner ModuleNotFoundError'd during
        # collection and interrupted the whole job (1 error, 0 tests run). Added.
        run: pip install -c constraints.txt fastapi "uvicorn[standard]" pydantic pytest httpx joblib numpy scikit-learn pandas polars pyjwt python-multipart slowapi  # 2026-10-14: python-jose replaced with pyjwt (CVE-2026-85394); -c constraints.txt pins the tested, reproducible versions
      - name: Run src/tests/ (HYPER shared-component tests -- auth_common.py,
          explainability_common.py; no business data, no notebook artifacts needed)
        run: python -m pytest src/tests/ -v

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - 01_mega_project_1_underwriting_approval
          - 02_mega_project_2_regulatory_capital
          - 03_mega_project_3_risk_segmentation
          - 04_mega_project_4_delinquency_prevention
          - 05_mega_project_5_liquidity_cashflow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install serving + test dependencies
        run: |
          if [ -f "${{ matrix.project }}/services/requirements-services.txt" ]; then
            pip install -c constraints.txt -r ${{ matrix.project }}/services/requirements-services.txt
          fi
          pip install -c constraints.txt pytest httpx requests
        if: hashFiles(format('{0}/tests/**', matrix.project)) != ''
      - name: Run scoring-service tests
        run: |
          cd ${{ matrix.project }}
          pytest tests/ -v
        if: hashFiles(format('{0}/tests/**', matrix.project)) != ''
        # Tests that need a real trained model bundle or fitted segment
        # model (each project's own .joblib bundles -- gitignored, produced
        # only by running those notebooks on real data) are marked
        # skip-if-missing rather than failing CI on a fresh clone with no
        # bundle present yet -- see each project's tests/test_scoring_services.py.
        # Every /schema and /score call in these tests now sends a real
        # X-API-Key header matching a monkeypatched API_KEY env var
        # (2026-09-02 hardening -- see src/serving/auth_common.py); /health
        # stays unauthenticated on every service. The matrix includes Mega
        # Project 4 with a hashFiles guard so this job does not fail before
        # MP4's own tests/ directory exists yet.
        # 2026-09-08: this same `pytest tests/ -v` step also picks up MP1's
        # and MP3's new tests/test_e2e_live_service.py -- a REAL end-to-end
        # integration test that launches the real service as a real `uvicorn`
        # subprocess (not in-process TestClient) and talks to it over real
        # HTTP via `requests`, added to this job's install line above. See
        # src/testing/e2e_process_harness.py and E2E_TESTING.md.

  validation-gate:
    # 2026-10-14: automates the Phase 1/2 audit itself -- runs the suite's
    # real test evidence + the bundle/sklearn-version consistency check
    # and uploads validation-results.json (commit SHA + per-check
    # PASS/FAIL/BLOCKED/NOT RUN) as a build artifact, so "did this pass"
    # is answered by a downloadable file, not a claim in a PR description.
    # pip-audit runs as its own job (code-quality.yml's dependency-audit);
    # skipped here to avoid running it twice per push.
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies (pinned)
        run: pip install -c constraints.txt pytest httpx requests joblib numpy scikit-learn pandas polars fastapi "uvicorn[standard]" pydantic pyjwt python-multipart slowapi
      - name: Run validation gate (skips pip-audit -- see dependency-audit job; skips per-project live-service tests -- those need real .joblib bundles this CI runner does not have)
        # 2026-10-14 fix: run_validation_gate.py now exits 0 (PASS), 1
        # (FAIL -- a check actually ran and found a real problem), or 2
        # (BLOCKED, no FAIL -- every check either passed or could not run
        # for a reason outside this suite's own code). Before this fix the
        # script exited 1 for BOTH FAIL and BLOCKED, and on a fresh CI
        # checkout check_bundle_sklearn_version() is ALWAYS BLOCKED (the
        # real .joblib bundles it loads are gitignored and never present
        # here) -- so this job failed on every single run regardless of
        # whether anything was actually broken. Exit code 2 is now a
        # warning annotation, not a build failure; validation-results.json
        # (uploaded below) still records BLOCKED truthfully either way.
        run: |
          set +e
          python scripts/run_validation_gate.py --skip-pip-audit --skip-project-tests
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::Validation gate FAILED -- see validation-results.json"
            exit 1
          elif [ "$code" -eq 2 ]; then
            echo "::warning::Validation gate BLOCKED (not FAILED) -- expected on a CI runner with no real .joblib bundles present. See validation-results.json for the exact check(s) blocked."
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-results
          path: validation-results.json
