# Verified container build & run -- closes the gap ROADMAP.md previously
# disclosed: "An actual docker build/docker run has not been performed for
# any of the hardened Mega Projects -- verification so far is structural
# only (docker compose config + static COPY-path existence checks), because
# this build environment has no Docker daemon." GitHub Actions' own
# ubuntu-latest runners ship Docker preinstalled, so this closes that gap at
# zero cost -- no local Docker Desktop required.
#
# Real trained model bundles are `.gitignore`d by design (see
# MODEL_REGISTRY.md) -- they only exist after actually running a notebook
# against the real, locally-downloaded Kaggle dataset. This job does NOT do
# that. It uses scripts/generate_ci_fixture_bundles.py to write small,
# clearly-synthetic bundles at the exact paths each Dockerfile expects, so
# the image can build and its service can start. This proves the Dockerfile,
# dependencies, and startup command are correct and that the service
# actually serves /health inside a real running container -- it proves
# NOTHING about model quality, which is validated separately at the
# notebook level on the real dataset (see each problem's MODEL_CARD.md).
name: Docker Build & Run Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "MP1 -- Underwriting & Approval"
            dockerfile: 01_mega_project_1_underwriting_approval/docker/Dockerfile
            image: hc-mp1-services
            port: 8001
          - name: "MP2 -- Regulatory Capital (formula-only, no model bundle)"
            dockerfile: 02_mega_project_2_regulatory_capital/docker/Dockerfile
            image: hc-mp2-services
            port: 8005
          - name: "MP3 -- Risk Segmentation"
            dockerfile: 03_mega_project_3_risk_segmentation/docker/Dockerfile
            image: hc-mp3-services
            port: 8007
          - name: "MP4 -- Delinquency Prevention"
            dockerfile: 04_mega_project_4_delinquency_prevention/docker/Dockerfile
            image: hc-mp4-services
            port: 8011
          - name: "MP5 -- Liquidity & Cashflow"
            dockerfile: 05_mega_project_5_liquidity_cashflow/docker/Dockerfile
            image: hc-mp5-services
            port: 8015
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install fixture-generation dependencies
        run: pip install joblib numpy scikit-learn

      - name: Generate synthetic CI fixture bundles (not real models -- see script docstring)
        run: python scripts/generate_ci_fixture_bundles.py

      - name: docker build -- ${{ matrix.name }}
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }} .

      - name: docker run -- ${{ matrix.name }}
        run: |
          docker run -d --name ${{ matrix.image }} \
            -p ${{ matrix.port }}:${{ matrix.port }} \
            -e HEALTHCHECK_PORT=${{ matrix.port }} \
            ${{ matrix.image }}

      - name: Wait for /health -- ${{ matrix.name }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${{ matrix.port }}/health" > /dev/null; then
              echo "Service healthy after ${i} attempt(s)."
              curl -s "http://127.0.0.1:${{ matrix.port }}/health"
              exit 0
            fi
            sleep 1
          done
          echo "Service never became healthy -- container logs:"
          docker logs ${{ matrix.image }}
          exit 1

      - name: Container logs (always shown for visibility)
        if: always()
        run: docker logs ${{ matrix.image }} || true

      - name: Stop and remove container
        if: always()
        run: docker rm -f ${{ matrix.image }} || true

  # Real TLS termination, verified end-to-end -- closes the disclosed gap
  # "No rate limiting or TLS termination anywhere in the service layer."
  # A real self-signed cert (generated fresh each run -- never a committed
  # cert/key), a real nginx TLS listener, reverse-proxying to real running
  # instances of every service.
  #
  # REWRITTEN 2026-09-10 (root-cause fix, not a workaround): the prior
  # version of this job ran nginx directly on the GitHub Actions runner
  # (apt-get installed) and started each backend as its own standalone
  # `docker run` container on Docker's default bridge network. That
  # combination can never work: docker/tls/nginx.conf's `proxy_pass`
  # targets are real Docker Compose service names (e.g.
  # `credit-default-prediction`), which only resolve via Docker's embedded
  # DNS *inside* a Compose-managed network -- not from a process running on
  # the bare host, and not across standalone `docker run` containers with
  # no shared user-defined network. Every one of the 5 matrix entries was
  # failing identically for this one structural reason (confirmed by
  # reproducing the design on paper against nginx.conf's own "service name
  # = hostname ... since nginx runs in its own container" comment -- this
  # job just wasn't honoring that).
  #
  # The fix: stop hand-rolling a parallel run mechanism and use each Mega
  # Project's own real `docker/docker-compose.tls.yml` directly via
  # `docker compose ... up --build`. This is simpler, and more correct than
  # the old approach -- it now verifies the *actual* deployment artifact
  # (Dockerfile + docker-compose.tls.yml + nginx.conf together, on a real
  # Compose network with real embedded DNS), not a CI-only reimplementation
  # of it. Extended 2026-09-10 from one representative service (MP1 Problem
  # 1 only) to all 15 deployable services across all 5 Mega Projects -- one
  # matrix entry per Mega Project. See TLS.md for the honest scope.
  tls-termination-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "MP1 -- Underwriting & Approval Intelligence"
            compose_file: 01_mega_project_1_underwriting_approval/docker/docker-compose.tls.yml
            tls_dir: 01_mega_project_1_underwriting_approval/docker/tls
            tls_ports: "9001 9002 9003 9004"
          - name: "MP2 -- Regulatory Capital & Stress Testing"
            compose_file: 02_mega_project_2_regulatory_capital/docker/docker-compose.tls.yml
            tls_dir: 02_mega_project_2_regulatory_capital/docker/tls
            tls_ports: "9005 9006"
          - name: "MP3 -- Risk Segmentation"
            compose_file: 03_mega_project_3_risk_segmentation/docker/docker-compose.tls.yml
            tls_dir: 03_mega_project_3_risk_segmentation/docker/tls
            tls_ports: "9007 9008 9009 9010"
          - name: "MP4 -- Delinquency Prevention"
            compose_file: 04_mega_project_4_delinquency_prevention/docker/docker-compose.tls.yml
            tls_dir: 04_mega_project_4_delinquency_prevention/docker/tls
            tls_ports: "9011 9012 9013 9014"
          - name: "MP5 -- Liquidity & Cashflow"
            compose_file: 05_mega_project_5_liquidity_cashflow/docker/docker-compose.tls.yml
            tls_dir: 05_mega_project_5_liquidity_cashflow/docker/tls
            tls_ports: "9015"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install fixture-generation dependencies
        run: pip install joblib numpy scikit-learn

      - name: Generate synthetic CI fixture bundles (not real models -- see script docstring)
        run: python scripts/generate_ci_fixture_bundles.py

      - name: Generate a real self-signed cert for this run (never committed --
          fresh every run; same real scripts/generate_local_tls_cert.sh a real
          local/production deployment would run once)
        run: scripts/generate_local_tls_cert.sh ${{ matrix.tls_dir }}

      - name: docker compose up --build -- ${{ matrix.name }} (real build, real
          containers, real Compose network -- the exact deployment artifact,
          not a CI-only reimplementation of it)
        run: |
          API_KEY=ci-fixture-key-not-a-real-secret \
            docker compose -f ${{ matrix.compose_file }} up --build -d

      - name: Wait for every real TLS port to answer over real HTTPS -- ${{ matrix.name }}
        run: |
          for port in ${{ matrix.tls_ports }}; do
            ok=""
            for i in $(seq 1 30); do
              if curl -sf -k "https://127.0.0.1:$port/health" > /dev/null; then
                echo "port $port healthy after ${i} attempt(s)."
                ok=1
                break
              fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "port $port never became healthy -- container logs:"
              docker compose -f ${{ matrix.compose_file }} logs
              exit 1
            fi
          done
          echo "Real TLS termination + reverse proxy verified for every service in ${{ matrix.name }}."

      - name: Container logs (always shown for visibility)
        if: always()
        run: docker compose -f ${{ matrix.compose_file }} logs || true

      - name: Cleanup
        if: always()
        run: docker compose -f ${{ matrix.compose_file }} down -v || true