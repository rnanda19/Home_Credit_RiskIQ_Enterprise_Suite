# Verified container build & run -- closes the gap ROADMAP.md previously
# disclosed: "An actual docker build/docker run has not been performed for
# any of the hardened Mega Projects -- verification so far is structural
# only (docker compose config + static COPY-path existence checks), because
# this build environment has no Docker daemon." GitHub Actions' own
# ubuntu-latest runners ship Docker preinstalled, so this closes that gap at
# zero cost -- no local Docker Desktop required.
#
# Real trained model bundles are `.gitignore`d by design (see
# MODEL_REGISTRY.md) -- they only exist after actually running a notebook
# against the real, locally-downloaded Kaggle dataset. This job does NOT do
# that. It uses scripts/generate_ci_fixture_bundles.py to write small,
# clearly-synthetic bundles at the exact paths each Dockerfile expects, so
# the image can build and its service can start. This proves the Dockerfile,
# dependencies, and startup command are correct and that the service
# actually serves /health inside a real running container -- it proves
# NOTHING about model quality, which is validated separately at the
# notebook level on the real dataset (see each problem's MODEL_CARD.md).
name: Docker Build & Run Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "MP1 -- Underwriting & Approval"
            dockerfile: 01_mega_project_1_underwriting_approval/docker/Dockerfile
            image: hc-mp1-services
            port: 8001
          - name: "MP2 -- Regulatory Capital (formula-only, no model bundle)"
            dockerfile: 02_mega_project_2_regulatory_capital/docker/Dockerfile
            image: hc-mp2-services
            port: 8005
          - name: "MP3 -- Risk Segmentation"
            dockerfile: 03_mega_project_3_risk_segmentation/docker/Dockerfile
            image: hc-mp3-services
            port: 8007
          - name: "MP4 -- Delinquency Prevention"
            dockerfile: 04_mega_project_4_delinquency_prevention/docker/Dockerfile
            image: hc-mp4-services
            port: 8011
          - name: "MP5 -- Liquidity & Cashflow"
            dockerfile: 05_mega_project_5_liquidity_cashflow/docker/Dockerfile
            image: hc-mp5-services
            port: 8015
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install fixture-generation dependencies
        run: pip install joblib numpy scikit-learn

      - name: Generate synthetic CI fixture bundles (not real models -- see script docstring)
        run: python scripts/generate_ci_fixture_bundles.py

      - name: docker build -- ${{ matrix.name }}
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }} .

      - name: docker run -- ${{ matrix.name }}
        run: |
          docker run -d --name ${{ matrix.image }} \
            -p ${{ matrix.port }}:${{ matrix.port }} \
            -e HEALTHCHECK_PORT=${{ matrix.port }} \
            ${{ matrix.image }}

      - name: Wait for /health -- ${{ matrix.name }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${{ matrix.port }}/health" > /dev/null; then
              echo "Service healthy after ${i} attempt(s)."
              curl -s "http://127.0.0.1:${{ matrix.port }}/health"
              exit 0
            fi
            sleep 1
          done
          echo "Service never became healthy -- container logs:"
          docker logs ${{ matrix.image }}
          exit 1

      - name: Container logs (always shown for visibility)
        if: always()
        run: docker logs ${{ matrix.image }} || true

      - name: Stop and remove container
        if: always()
        run: docker rm -f ${{ matrix.image }} || true

  # Real TLS termination, verified end-to-end -- closes the disclosed gap
  # "No rate limiting or TLS termination anywhere in the service layer."
  # A real self-signed cert (generated fresh each run -- never a committed
  # cert/key), a real nginx TLS listener, reverse-proxying to real running
  # instances of every service. Extended 2026-09-10 from one representative
  # service (MP1 Problem 1 only) to all 15 deployable services across all 5
  # Mega Projects -- one matrix entry per Mega Project, each spinning up
  # every one of that project's services as its own real container and
  # verifying every one of them through the real TLS listener. Uses each
  # project's own real `docker/tls/nginx.conf` (the same file
  # docker-compose.tls.yml bind-mounts for local/production use -- CI now
  # tests the exact file that gets deployed, not a separate CI-only
  # variant). See TLS.md for the honest scope.
  tls-termination-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "MP1 -- Underwriting & Approval Intelligence"
            dockerfile: 01_mega_project_1_underwriting_approval/docker/Dockerfile
            image: hc-mp1-tls
            nginx_conf: 01_mega_project_1_underwriting_approval/docker/tls/nginx.conf
            services_json: '[{"name": "credit-default-prediction", "port": 8001, "module": "credit_default_scoring_service:app", "tls_port": 9001}, {"name": "loan-application-approval", "port": 8002, "module": "loan_approval_scoring_service:app", "tls_port": 9002}, {"name": "credit-score-estimation", "port": 8003, "module": "credit_score_service:app", "tls_port": 9003}, {"name": "repayment-capacity-analysis", "port": 8004, "module": "repayment_capacity_service:app", "tls_port": 9004}]'
          - name: "MP2 -- Regulatory Capital & Stress Testing"
            dockerfile: 02_mega_project_2_regulatory_capital/docker/Dockerfile
            image: hc-mp2-tls
            nginx_conf: 02_mega_project_2_regulatory_capital/docker/tls/nginx.conf
            services_json: '[{"name": "capital-requirement", "port": 8005, "module": "capital_requirement_service:app", "tls_port": 9005}, {"name": "macro-stress-testing", "port": 8006, "module": "stress_testing_service:app", "tls_port": 9006}]'
          - name: "MP3 -- Risk Segmentation"
            dockerfile: 03_mega_project_3_risk_segmentation/docker/Dockerfile
            image: hc-mp3-tls
            nginx_conf: 03_mega_project_3_risk_segmentation/docker/tls/nginx.conf
            services_json: '[{"name": "risk-tier-assignment", "port": 8007, "module": "risk_tier_assignment_service:app", "tls_port": 9007}, {"name": "bureau-segment-assignment", "port": 8008, "module": "bureau_segment_assignment_service:app", "tls_port": 9008}, {"name": "repayment-segment-assignment", "port": 8009, "module": "repayment_segment_assignment_service:app", "tls_port": 9009}, {"name": "utilization-segment-assignment", "port": 8010, "module": "utilization_segment_assignment_service:app", "tls_port": 9010}]'
          - name: "MP4 -- Delinquency Prevention"
            dockerfile: 04_mega_project_4_delinquency_prevention/docker/Dockerfile
            image: hc-mp4-tls
            nginx_conf: 04_mega_project_4_delinquency_prevention/docker/tls/nginx.conf
            services_json: '[{"name": "early-delinquency-scoring", "port": 8011, "module": "early_delinquency_scoring_service:app", "tls_port": 9011}, {"name": "payment-pattern-assignment", "port": 8012, "module": "payment_pattern_assignment_service:app", "tls_port": 9012}, {"name": "revolving-distress-scoring", "port": 8013, "module": "revolving_distress_scoring_service:app", "tls_port": 9013}, {"name": "pos-cash-trajectory-scoring", "port": 8014, "module": "pos_cash_trajectory_scoring_service:app", "tls_port": 9014}]'
          - name: "MP5 -- Liquidity & Cashflow"
            dockerfile: 05_mega_project_5_liquidity_cashflow/docker/Dockerfile
            image: hc-mp5-tls
            nginx_conf: 05_mega_project_5_liquidity_cashflow/docker/tls/nginx.conf
            services_json: '[{"name": "prepayment-segment-assignment", "port": 8015, "module": "prepayment_segment_assignment_service:app", "tls_port": 9015}]'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install fixture-generation dependencies
        run: pip install joblib numpy scikit-learn

      - name: Generate synthetic CI fixture bundles (not real models -- see script docstring)
        run: python scripts/generate_ci_fixture_bundles.py

      - name: docker build -- ${{ matrix.name }}
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }} .

      - name: Start every service in this Mega Project as its own real container (plain HTTP, as designed -- TLS is terminated in front, not inside)
        run: |
          echo '${{ matrix.services_json }}' > /tmp/services.json
          jq -c '.[]' /tmp/services.json | while read -r svc; do
            name=$(echo "$svc" | jq -r '.name')
            port=$(echo "$svc" | jq -r '.port')
            module=$(echo "$svc" | jq -r '.module')
            docker run -d --name "$name" -p "$port:$port" -e HEALTHCHECK_PORT="$port" \
              ${{ matrix.image }} uvicorn "$module" --host 0.0.0.0 --port "$port"
            for i in $(seq 1 30); do
              if curl -sf "http://127.0.0.1:$port/health" > /dev/null; then
                echo "$name healthy on $port after ${i} attempt(s)."
                break
              fi
              sleep 1
            done
          done

      - name: Generate a real self-signed cert for this run (never committed -- fresh every run)
        run: |
          sudo mkdir -p /etc/nginx/tls
          sudo openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /etc/nginx/tls/key.pem -out /etc/nginx/tls/cert.pem -days 1 -subj "/CN=localhost"

      - name: Install and run nginx as a real TLS-terminating reverse proxy, using this Mega Project's own real nginx.conf
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx
          sudo nginx -c "$(pwd)/${{ matrix.nginx_conf }}"
          sleep 1

      - name: Real HTTPS request through TLS termination to every real running service in this Mega Project
        run: |
          jq -c '.[]' /tmp/services.json | while read -r svc; do
            name=$(echo "$svc" | jq -r '.name')
            tls_port=$(echo "$svc" | jq -r '.tls_port')
            echo "Checking $name over TLS on $tls_port ..."
            curl -sf -k "https://127.0.0.1:$tls_port/health"
            echo
          done
          echo "Real TLS termination + reverse proxy verified for every service in ${{ matrix.name }}."

      - name: Container logs (always shown for visibility)
        if: always()
        run: |
          jq -r '.[].name' /tmp/services.json | while read -r name; do
            echo "--- $name ---"
            docker logs "$name" || true
          done

      - name: Cleanup
        if: always()
        run: |
          sudo nginx -s stop || true
          jq -r '.[].name' /tmp/services.json | while read -r name; do
            docker rm -f "$name" || true
          done