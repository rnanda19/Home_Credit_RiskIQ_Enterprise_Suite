name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install pyflakes black
      - name: pyflakes (advisory - does not fail the build)
        run: pyflakes src/ 01_mega_project_1_underwriting_approval/services/ 01_mega_project_1_underwriting_approval/tests/ 02_mega_project_2_regulatory_capital/services/ 02_mega_project_2_regulatory_capital/tests/ 03_mega_project_3_risk_segmentation/services/ 03_mega_project_3_risk_segmentation/tests/ 04_mega_project_4_delinquency_prevention/services/ 04_mega_project_4_delinquency_prevention/tests/ 05_mega_project_5_liquidity_cashflow/services/ 05_mega_project_5_liquidity_cashflow/tests/ || true
      - name: black --check (advisory - repo-wide reformat deliberately deferred)
        run: black --check --diff src/ 01_mega_project_1_underwriting_approval/services/ 01_mega_project_1_underwriting_approval/tests/ 02_mega_project_2_regulatory_capital/services/ 02_mega_project_2_regulatory_capital/tests/ 03_mega_project_3_risk_segmentation/services/ 03_mega_project_3_risk_segmentation/tests/ 04_mega_project_4_delinquency_prevention/services/ 04_mega_project_4_delinquency_prevention/tests/ 05_mega_project_5_liquidity_cashflow/services/ 05_mega_project_5_liquidity_cashflow/tests/ || true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install bandit
      - name: bandit security scan of src/ and services/ (BLOCKING - excludes tests/ to
          avoid false positives on test fixtures/assertions)
        run: bandit -r src/ 01_mega_project_1_underwriting_approval/services/ 02_mega_project_2_regulatory_capital/services/ 03_mega_project_3_risk_segmentation/services/ 04_mega_project_4_delinquency_prevention/services/ 05_mega_project_5_liquidity_cashflow/services/ -ll
